plugins {
    id 'net.fabricmc.fabric-loom' version "${loom_version}"
}

version = project.mod_version
group = project.maven_group
base { archivesName = project.archives_base_name }

repositories { }

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
}

processResources {
    inputs.property 'version', project.version
    filesMatching('fabric.mod.json') { expand 'version': project.version }
}

java {
    toolchain { languageVersion = JavaLanguageVersion.of(25) }
    withSourcesJar()
}

tasks.withType(JavaCompile).configureEach { it.options.release = 25 }

jar { from('LICENSE') { rename { "${it}_${project.base.archivesName.get()}" } } }

// In-game check (CI only): loads a small schematic over HTTP and saves the dashboard data.
fabricApi {
    configureTests {
        createSourceSet = true
        modId = 'schematicprogress-gametest'
        enableGameTests = false
        enableClientGameTests = true
        eula = true
    }
}
