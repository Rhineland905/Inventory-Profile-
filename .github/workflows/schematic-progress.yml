name: Build Schematic Progress
on:
  push:
    paths: ['schematic-progress/**', '.github/workflows/schematic-progress.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: schematic-progress
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x gradlew && ./gradlew build --stacktrace
      - name: API hints on failure
        if: failure()
        run: |
          JAR=""
          for j in $(find ~/.gradle/caches .gradle -name '*.jar' 2>/dev/null | grep -i minecraft | grep -v sources); do
            if unzip -l "$j" | grep -q 'net/minecraft/client/multiplayer/ClientLevel.class'; then JAR="$j"; break; fi
          done
          echo "JAR=$JAR"
          for c in net.minecraft.client.multiplayer.ClientLevel net.minecraft.world.level.Level net.minecraft.world.level.LevelReader \
                   net.minecraft.world.level.block.Block net.minecraft.world.level.block.state.BlockBehaviour\$BlockStateBase \
                   net.minecraft.world.level.material.MapColor net.minecraft.world.entity.player.Inventory \
                   net.minecraft.client.Minecraft net.minecraft.world.item.ItemStack net.minecraft.core.Registry; do
            javap -cp "$JAR" -public "$c" || true
          done
      - run: ls -la build/libs/
      # Draft release: not public, only used to hand the jar over.
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: schematic-progress-26.3
          name: Schematic Progress for Fabric 26.3
          draft: true
          target_commitish: ${{ github.sha }}
          files: schematic-progress/build/libs/schematic-progress-*.jar
