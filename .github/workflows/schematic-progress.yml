name: Build Schematic Progress
on:
  push:
    paths: ['schematic-progress/**', '.github/workflows/schematic-progress.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: schematic-progress
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x gradlew && ./gradlew build --stacktrace
      - name: API hints on failure
        if: failure()
        run: |
          JAR=""
          for j in $(find ~/.gradle/caches .gradle -name '*.jar' 2>/dev/null | grep -i minecraft | grep -v sources); do
            if unzip -l "$j" | grep -q 'net/minecraft/client/multiplayer/ClientLevel.class'; then JAR="$j"; break; fi
          done
          echo "JAR=$JAR"
          for c in net.minecraft.client.multiplayer.ClientLevel net.minecraft.world.level.Level net.minecraft.world.level.LevelReader \
                   net.minecraft.world.level.block.Block net.minecraft.world.level.block.state.BlockBehaviour\$BlockStateBase \
                   net.minecraft.world.level.material.MapColor net.minecraft.world.entity.player.Inventory \
                   com.mojang.blaze3d.platform.InputConstants net.minecraft.client.Minecraft net.minecraft.world.item.ItemStack net.minecraft.core.Registry; do
            javap -cp "$JAR" -public "$c" || true
          done
      - name: Key code check
        run: |
          J=$(find ~/.gradle/caches .gradle -name '*.jar' 2>/dev/null | grep -i minecraft | grep -v sources | while read j; do unzip -l "$j" | grep -q 'com/mojang/blaze3d/platform/InputConstants.class' && echo "$j" && break; done)
          javap -cp "$J" -public -constants com.mojang.blaze3d.platform.InputConstants | grep -E 'KEY_(N|J|U|K|O|UNKNOWN)\b|UNKNOWN' || true
      - run: ls -la build/libs/
      - run: sudo apt-get update -q && sudo apt-get install -yq xvfb libglx-mesa0 mesa-vulkan-drivers mesa-utils libgl1-mesa-dri libgl1 libegl1 libx11-6 libxext6 libxrandr2 libxcursor1 libxi6 libxss1 libxinerama1 libxkbcommon0 libxkbcommon-x11-0 libxfixes3 libdecor-0-0 libwayland-client0 || true
      - name: In-game test
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
          SDL_VIDEODRIVER: x11
          MESA_GL_VERSION_OVERRIDE: "4.6"
          MESA_GLSL_VERSION_OVERRIDE: "460"
          GALLIUM_DRIVER: llvmpipe
        run: timeout 900 xvfb-run -a -s "-screen 0 1280x720x24+32 +extension GLX +render -noreset" ./gradlew runClientGameTest --stacktrace 2>&1 | tee gametest.log; echo "exit ${PIPESTATUS[0]}"
      - name: Collect
        if: always()
        run: |
          mkdir -p out
          find . -path ./out -prune -o -path '*schematic-progress-test*' -type f -print -exec cp {} out/ \;
          find . -path ./out -prune -o -name '*.png' -path '*screenshot*' -print -exec cp {} out/ \;
          find . -path ./out -prune -o -name 'latest.log' -print -exec cp {} out/latest.log \;
          find . -path ./out -prune -o -path '*crash-reports*' -name '*.txt' -print -exec cp {} out/ \;
          cp gametest.log out/gametest.log || true
          ls -la out
      # Draft release: not public, only used to hand the jar over.
      - uses: softprops/action-gh-release@v2
        if: always()
        with:
          tag_name: schematic-progress-26.3
          name: Schematic Progress for Fabric 26.3
          draft: true
          target_commitish: ${{ github.sha }}
          files: |
            schematic-progress/build/libs/schematic-progress-*.jar
            schematic-progress/out/*
