name: Build Portal Breaker
on:
  push:
    paths: ['portal-breaker/**', '.github/workflows/portal-breaker.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: portal-breaker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x gradlew && ./gradlew build --stacktrace
      - name: API hints on failure
        if: failure()
        run: |
          for j in $(find ~/.gradle/caches -name 'fabric-*key*.jar' | grep -v sources | head -5); do
            echo "== $j"; unzip -l "$j" | grep -E 'api/.*\.class' | head -20
          done
      - run: ls -la build/libs/
      # Draft release: not public, only used to hand the jar over.
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: portal-breaker-26.3
          name: Portal Breaker for Fabric 26.3
          draft: true
          target_commitish: ${{ github.sha }}
          files: portal-breaker/build/libs/portal-breaker-*.jar
