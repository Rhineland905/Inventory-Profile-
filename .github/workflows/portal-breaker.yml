name: Build Portal Breaker
on:
  push:
    paths: ['portal-breaker/**', '.github/workflows/portal-breaker.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: portal-breaker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x gradlew && ./gradlew build --stacktrace
      - name: API hints on failure
        if: failure()
        run: |
          for j in $(find ~/.gradle/caches -name '*.jar' | grep -iE 'key-?binding|minecraft-(client|merged)' | head -20); do
            echo "== $j"; unzip -l "$j" | grep -iE 'keybinding|KeyMapping|gui/components/(Button|EditBox)\.class|GuiGraphicsExtractor' | head -20
          done
          J=$(find ~/.gradle/caches -name 'minecraft-*.jar' | grep -iE 'client|merged' | grep -v sources | head -1)
          [ -n "$J" ] && for c in net.minecraft.client.KeyMapping 'net.minecraft.client.KeyMapping$Category' net.minecraft.client.gui.GuiGraphicsExtractor net.minecraft.client.gui.components.EditBox; do javap -cp "$J" -public "$c" | head -60; done || true
      - run: ls -la build/libs/
      # Draft release: not public, only used to hand the jar over.
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: portal-breaker-26.3
          name: Portal Breaker for Fabric 26.3
          draft: true
          target_commitish: ${{ github.sha }}
          files: portal-breaker/build/libs/portal-breaker-*.jar
