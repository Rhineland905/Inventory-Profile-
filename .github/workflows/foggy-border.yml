name: Build Foggy Border
on:
  push:
    paths: ['foggy-border/**', '.github/workflows/foggy-border.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: foggy-border
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x gradlew && ./gradlew build --stacktrace
      - name: API dump
        if: always()
        run: |
          JAR=""
          for j in $(find ~/.gradle/caches .gradle -name '*.jar' 2>/dev/null | grep -i minecraft | grep -v sources); do
            if unzip -l "$j" | grep -q 'net/minecraft/client/renderer/fog/FogRenderer.class'; then JAR="$j"; break; fi
          done
          echo "JAR=$JAR"
          unzip -l "$JAR" | grep -iE 'renderer/chunk/|WorldBorder|fog/' || true
          javap -cp "$JAR" -p -c net.minecraft.client.renderer.fog.FogRenderer || true
          for c in net.minecraft.client.renderer.fog.FogData net.minecraft.client.renderer.chunk.SectionCopy \
                   net.minecraft.client.renderer.WorldBorderRenderer net.minecraft.world.level.border.WorldBorder \
                   net.minecraft.client.Minecraft net.minecraft.client.renderer.GameRenderer; do
            javap -cp "$JAR" -p "$c" || true
          done
          javap -cp "$JAR" -p -c net.minecraft.client.renderer.chunk.SectionCopy || true
      - run: ls -la build/libs/
      - run: sudo apt-get update -q && sudo apt-get install -yq xvfb libglx-mesa0 mesa-vulkan-drivers advancecomp mesa-utils libgl1-mesa-dri libgl1 libegl1 libx11-6 libxext6 libxrandr2 libxcursor1 libxi6 libxss1 libxinerama1 libxkbcommon0 libxkbcommon-x11-0 libxfixes3 libdecor-0-0 libwayland-client0 || true
      - name: In-game test
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
          SDL_VIDEODRIVER: x11
          MESA_GL_VERSION_OVERRIDE: "4.6"
          MESA_GLSL_VERSION_OVERRIDE: "460"
          GALLIUM_DRIVER: llvmpipe
        run: timeout 900 xvfb-run -a -s "-screen 0 1280x720x24+32 +extension GLX +render -noreset" ./gradlew runClientGameTest --stacktrace 2>&1 | tee gametest.log; echo "exit ${PIPESTATUS[0]}"
      - name: Collect
        if: always()
        run: |
          mkdir -p out
          find . -path ./out -prune -o -name '*.png' -path '*screenshot*' -print -exec cp {} out/ \;
          find . -path ./out -prune -o -name 'latest.log' -print -exec cp {} out/latest.log \;
          find . -path ./out -prune -o -path '*crash-reports*' -name '*.txt' -print -exec cp {} out/ \;
          cp gametest.log out/gametest.log || true
          ls -la out
      # Draft release: not public, only used to hand the jar over.
      - uses: softprops/action-gh-release@v2
        if: always()
        with:
          tag_name: foggy-border-26.3
          name: Foggy Border for Fabric 26.3
          draft: true
          target_commitish: ${{ github.sha }}
          files: |
            foggy-border/build/libs/foggy-border-*.jar
            foggy-border/out/*
