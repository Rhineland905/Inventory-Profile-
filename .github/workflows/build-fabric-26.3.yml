name: Build Fabric 26.3
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: |
            21
            25
      - uses: gradle/actions/setup-gradle@v4
      - name: Build
        run: ./gradlew :platforms:fabric-26.3:build --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: ipn-fabric-26.3-no-auto-totem
          path: platforms/fabric-26.3/build/libs/*.jar
