name: Probe APIs
on:
  push:
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: |
            21
            25
      - uses: gradle/actions/setup-gradle@v4
      - run: sed -i '/include("platforms:/{/fabric-26.3/!d}' settings.gradle.kts
      - run: ./gradlew :platforms:fabric-26.3:compileJava -q || true
      - name: Probe
        run: |
          set +e
          MC=$(find ~/.gradle .gradle -name '*.jar' 2>/dev/null | grep -iE 'minecraft-(clientOnly|merged|client)' | grep -v sources | head -1)
          for c in net.minecraft.client.gui.screens.Screen net.minecraft.client.gui.components.events.GuiEventListener net.minecraft.client.input.MouseButtonEvent net.minecraft.client.input.KeyEvent net.minecraft.client.input.MouseButtonInfo; do echo "#### $c"; javap -cp "$MC" $c | grep -v 'lambda\$'; done
          unzip -l "$MC" | grep -E 'client/input/' | head -30
