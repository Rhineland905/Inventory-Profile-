name: Publish dependency jars
on:
  push:
permissions:
  contents: write
jobs:
  deps:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: |
            21
            25
      - uses: gradle/actions/setup-gradle@v4
      - run: sed -i '/include("platforms:/{/fabric-26.3/!d}' settings.gradle.kts
      - run: ./gradlew :platforms:fabric-26.3:compileJava -q || true
      - name: Find and upload jars
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          find ~/.gradle -name '*.jar' | grep -iE 'libipn|fabric-language-kotlin' | grep -v sources | sort
          mkdir out
          LIB=$(find ~/.gradle -name '*.jar' | grep -i libipn | grep -i fabric | grep -i '26.3' | grep -viE 'sources|dev' | head -1)
          [ -z "$LIB" ] && LIB=$(find ~/.gradle -name '*.jar' | grep -i libipn | grep -viE 'sources' | head -1)
          FLK=$(find ~/.gradle -name 'fabric-language-kotlin-*.jar' | grep -v sources | head -1)
          echo "LIB=$LIB FLK=$FLK"
          cp "$LIB" "out/$(basename "$LIB")"; cp "$FLK" "out/$(basename "$FLK")"
          unzip -p "$LIB" fabric.mod.json | head -40
          ls -la out
          gh release upload fabric-26.3-no-auto-totem out/*.jar --clobber -R ${{ github.repository }}
