name: Probe APIs
on:
  push:
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: |
            21
            25
      - uses: gradle/actions/setup-gradle@v4
      - run: sed -i '/include("platforms:/{/fabric-26.3/!d}' settings.gradle.kts
      - run: ./gradlew :platforms:fabric-26.3:compileJava -q || true
      - name: Probe
        run: |
          set +e
          MC=$(find ~/.gradle .gradle -name '*.jar' 2>/dev/null | grep -iE 'minecraft-(clientOnly|merged|client)' | grep -v sources | head -1)
          javap -cp "$MC" net.minecraft.client.Minecraft | grep -iE 'screen|font|public .* gui|player;' 
          javap -cp "$MC" -p net.minecraft.client.Minecraft | grep -iE ' screen;|setScreen|Screen\)'
          javap -cp "$MC" net.minecraft.client.gui.Hud | grep -i screen
